name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore keystore
        uses: actions/cache@v4
        with:
          path: keystore.jks
          key: coc-keystore-v1

      - name: Create keystore if missing
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias coc \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass coc123456 -keypass coc123456 \
              -dname "CN=coc-tracker, OU=coc, O=coc, L=Beijing, ST=Beijing, C=CN"
          fi

      - name: Unzip icons
        run: |
          if [ -f app/src/main/assets/icons.zip ]; then
            cd app/src/main/assets && unzip -o -q icons.zip -d icons && rm icons.zip
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon -PverCode=${{ github.run_number }} -PverName=1.0.${{ github.run_number }}

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coc-tracker-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 村庄监工 v${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
